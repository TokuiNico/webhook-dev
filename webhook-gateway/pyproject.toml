[project]
name = "webhook-gateway"
version = "0.1.0"
description = "A robust webhook gateway to ingest, validate, and dispatch webhooks from various sources."
authors = [{ name = "Your Name", email = "you@example.com" }]

requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "sqlalchemy",
    "mysqlclient", # Driver for MySQL
    "celery",
    "redis", # Recommended broker and result backend for Celery
    "fakeredis", # For development and testing without real Redis
    "alembic", # For database migrations
    "python-multipart", # For handling form data
    "lxml", # For handling XML
    "pydantic-settings", # For managing settings # For making HTTP requests in the worker
    "httpx",
    "aiosqlite>=0.21.0",
    "requests>=2.32.4",
    "chardet>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "fakeredis", # Also include in dev dependencies
]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88
