version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: webhook_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-webhook_db}
      MYSQL_USER: ${MYSQL_USER:-webhook_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-webhook_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis service (optional for development with fakeredis)
  redis:
    image: redis:7-alpine
    container_name: webhook_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - production  # Only start Redis in production profile

  # Development API (uses fakeredis)
  api-dev:
    build: .
    container_name: webhook_api_dev
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER:-webhook_user}:${MYSQL_PASSWORD:-webhook_password}@db:3306/${MYSQL_DATABASE:-webhook_db}
      - REDIS_URL=redis://localhost:6379/0
      - DEVELOPMENT=true
      - USE_FAKE_REDIS=true
    env_file:
      - .env
    profiles:
      - dev
      - default

  # Development Worker (uses fakeredis)
  worker-dev:
    build: .
    container_name: webhook_worker_dev
    command: uv run celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER:-webhook_user}:${MYSQL_PASSWORD:-webhook_password}@db:3306/${MYSQL_DATABASE:-webhook_db}
      - REDIS_URL=redis://localhost:6379/0
      - DEVELOPMENT=true
      - USE_FAKE_REDIS=true
    env_file:
      - .env
    profiles:
      - dev
      - default

  # Production API (uses real Redis)
  api:
    build: .
    container_name: webhook_api
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER:-webhook_user}:${MYSQL_PASSWORD:-webhook_password}@db:3306/${MYSQL_DATABASE:-webhook_db}
      - REDIS_URL=redis://redis:6379/0
      - DEVELOPMENT=false
      - USE_FAKE_REDIS=false
    env_file:
      - .env
    profiles:
      - production

  # Production Worker (uses real Redis)
  worker:
    build: .
    container_name: webhook_worker
    command: uv run celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER:-webhook_user}:${MYSQL_PASSWORD:-webhook_password}@db:3306/${MYSQL_DATABASE:-webhook_db}
      - REDIS_URL=redis://redis:6379/0
      - DEVELOPMENT=false
      - USE_FAKE_REDIS=false
    env_file:
      - .env
    profiles:
      - production

volumes:
  mysql_data:
  redis_data:
