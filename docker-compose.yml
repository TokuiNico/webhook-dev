services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: webhook_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webhook_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webhook_password}
      POSTGRES_DB: ${POSTGRES_DB:-webhook_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webhook_user} -d ${POSTGRES_DB:-webhook_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webhook-network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: webhook_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - webhook-network

  # API Server (Backend)
  api:
    build: .
    container_name: webhook_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-webhook_user}:${POSTGRES_PASSWORD:-webhook_password}@db:5432/${POSTGRES_DB:-webhook_db}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@rabbitmq:5672/
      - USE_SQLITE=false
      - USE_MEMORY_BROKER=false
      - DEVELOPMENT=false
      - API_KEY=${API_KEY:-change-me-in-production}
      - CORS_ORIGINS=["*"]
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - webhook-network

  # TaskIQ Worker
  worker:
    build: .
    container_name: webhook_worker
    restart: unless-stopped
    command: taskiq worker app.taskiq.broker_manager:broker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-webhook_user}:${POSTGRES_PASSWORD:-webhook_password}@db:5432/${POSTGRES_DB:-webhook_db}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@rabbitmq:5672/
      - USE_SQLITE=false
      - USE_MEMORY_BROKER=false
      - DEVELOPMENT=false
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    networks:
      - webhook-network

  # Frontend (Nginx + React App)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: webhook_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - webhook-network

networks:
  webhook-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
